name: Franklin County Lead Scraper

on:
  schedule:
    # 07:00 UTC daily. Adjust for your timezone as needed.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      records_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml dbfread playwright

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          LOOKBACK_DAYS: "7"
          HEADLESS: "true"
        run: python scraper/fetch.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- dashboard/records.json data/records.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated records
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "franklin-lead-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/ghl_export.csv
          git commit -m "chore: refresh leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload scrape debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scraper/debug/**
          if-no-files-found: ignore

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
